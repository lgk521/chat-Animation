<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=375, initial-scale=1.0">
<title>码道小助手</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 375px; height: 720px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #ededed; display: flex; flex-direction: column; }
.header { height: 48px; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); display: flex; align-items: center; justify-content: center; border-radius: 0 0 18px 18px; box-shadow: 0 4px 18px rgba(0,0,0,.3); position: relative; }
.header::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, #ff2d95, #7b2ff7, #00e5ff); box-shadow: 0 0 12px rgba(123,47,247,.8); border-radius: 0 0 18px 18px; }
.header .back { position: absolute; left: 12px; font-size: 22px; color: #00e5ff; text-shadow: 0 0 8px rgba(0,229,255,.6); }
.header .title { font-size: 17px; font-weight: 600; color: #fff; letter-spacing: 1px; text-shadow: 0 0 10px rgba(0,229,255,.7); }
.chat { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 16px; }
.msg { display: flex; align-items: flex-start; gap: 8px; max-width: 100%; opacity: 0; transform: translateY(12px); animation: pop .3s ease forwards; }
.msg.right { flex-direction: row-reverse; }
@keyframes pop { to { opacity: 1; transform: translateY(0); } }
.avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; align-items: center; justify-content: center; font-size: 18px; border: 1.5px solid #00e5ff; box-shadow: 0 0 8px rgba(0,229,255,.5), inset 0 0 4px rgba(123,47,247,.3); }
.bubble { padding: 9px 12px; border-radius: 8px; font-size: 15px; line-height: 1.5; max-width: 240px; word-break: break-word; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.msg.left .bubble { background: #fff; color: #181818; }
.msg.left .bubble::before { content: ""; position: absolute; left: -5px; top: 13px; width: 0; height: 0; border-style: solid; border-width: 0 6px 7px 0; border-color: transparent #fff transparent transparent; filter: drop-shadow(-1px 0 0 rgba(0,0,0,.04)); }
.msg.right .bubble { background: linear-gradient(135deg, #ff2d95, #7b2ff7, #00e5ff); color: #fff; box-shadow: 0 2px 12px rgba(123,47,247,.45); }
.msg.right .bubble::before { content: ""; position: absolute; right: -5px; top: 13px; width: 0; height: 0; border-style: solid; border-width: 0 0 7px 6px; border-color: transparent transparent #7b2ff7 transparent; filter: drop-shadow(1px 0 0 rgba(123,47,247,.3)); }
.time-sep { align-self: center; background: #cecece; color: #fff; font-size: 11px; padding: 2px 10px; border-radius: 10px; opacity: 0; animation: pop .3s ease forwards; }
.typing { display: flex; align-items: flex-start; gap: 8px; opacity: 0; transition: opacity .2s; }
.typing.show { opacity: 1; }
.typing .avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; background: linear-gradient(135deg, #1a1a2e, #16213e); display: flex; align-items: center; justify-content: center; font-size: 18px; border: 1.5px solid #00e5ff; box-shadow: 0 0 8px rgba(0,229,255,.5), inset 0 0 4px rgba(123,47,247,.3); }
.typing .dots { background: #fff; border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; gap: 4px; position: relative; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.typing .dots::before { content: ""; position: absolute; left: -5px; top: 13px; width: 0; height: 0; border-style: solid; border-width: 0 6px 7px 0; border-color: transparent #fff transparent transparent; }
.typing .label { color: #07c160; font-size: 13px; margin-right: 2px; }
.typing .label::after { content: ""; animation: ellipsis 1.4s steps(4) infinite; }
@keyframes ellipsis { 0% { content: ""; } 25% { content: "·"; } 50% { content: "··"; } 75% { content: "···"; } 100% { content: ""; } }
.typing .dot { width: 6px; height: 6px; border-radius: 50%; background: #07c160; animation: bounce 1.2s infinite; }
.typing .dot:nth-child(3) { animation-delay: .2s; }
.typing .dot:nth-child(4) { animation-delay: .4s; }
@keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: .5; } 30% { transform: translateY(-6px); opacity: 1; } }
.input-bar { height: 52px; background: #f7f7f7; border-top: 1px solid #d6d6d6; display: flex; align-items: center; padding: 0 10px; gap: 8px; }
.input-bar .voice, .input-bar .emoji { font-size: 22px; color: #333; width: 32px; text-align: center; }
.input-bar input { flex: 1; height: 34px; border: 1px solid #ddd; border-radius: 4px; padding: 0 8px; font-size: 15px; background: #fff; }
.input-bar .send { background: #ff3b30; color: #fff; border: none; border-radius: 4px; padding: 6px 14px; font-size: 14px; }
</style>
</head>
<body>
  <div class="header">
    <span class="back">‹</span>
    <span class="title">码道小助手</span>
  </div>
  <div class="chat" id="chat"></div>
  <div class="input-bar">
    <span class="voice">🎤</span>
    <input type="text" placeholder="发消息">
    <span class="emoji">😊</span>
    <button class="send">发送</button>
  </div>
<script>
const chat = document.getElementById('chat')
const script = [
  { side: 'left',  text: '在吗？', typing: 900 },
  { side: 'right', text: '在的，怎么啦？' },
  { side: 'left',  text: '我想用 AI 做一个无限动画，听说可以用 git 边做边回退？', typing: 1400 },
  { side: 'right', text: '对，思路很简单' },
  { side: 'left',  text: '满意就 commit，不满意就 checkout / reset 回退再改', typing: 1200 },
  { side: 'right', text: '懂了，那我先去试试' },
  { side: 'left',  text: '👍 有不懂的随时问', typing: 700 },
]
const avatars = { left: '🤖', right: '😀' }
function scrollBottom() { chat.scrollTop = chat.scrollHeight }
function addSep(text) {
  const d = document.createElement('div')
  d.className = 'time-sep'
  d.textContent = text
  chat.appendChild(d)
  scrollBottom()
}
function addMsg(side, text) {
  const d = document.createElement('div')
  d.className = 'msg ' + side
  d.innerHTML = `<div class="avatar">${avatars[side]}</div><div class="bubble">${text}</div>`
  chat.appendChild(d)
  scrollBottom()
}
function showTyping() {
  const t = document.createElement('div')
  t.className = 'typing show'
  t.id = 'typing-indicator'
  t.innerHTML = `<div class="avatar">🤖</div><div class="dots"><span class="label">对方正在输入</span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`
  chat.appendChild(t)
  scrollBottom()
}
function hideTyping() {
  const t = document.getElementById('typing-indicator')
  if (t) t.remove()
}
const sleep = ms => new Promise(r => setTimeout(r, ms))
async function play() {
  while (true) {
    chat.innerHTML = ''
    addSep('今天 14:30')
    for (const m of script) {
      if (m.side === 'left' && m.typing) {
        showTyping()
        await sleep(m.typing)
        hideTyping()
      }
      addMsg(m.side, m.text)
      await sleep(m.side === 'left' ? 500 : 800)
    }
    await sleep(2500)
  }
}
play()
</script>
</body>
</html>
